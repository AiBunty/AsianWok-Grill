<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event QR Scanner - Asian Wok & Grill</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="canonical" href="https://asianwokandgrill.in/qr.html">
    <meta property="og:url" content="https://asianwokandgrill.in/qr.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #c41e3a;
            --primary-dark: #a01830;
            --primary-light: #e73c5a;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --bg-light: #f9f9f9;
            --bg-lighter: #f5f5f5;
            --success: #28a745;
            --danger: #dc3545;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #fff;
            color: var(--text-primary);
        }

        .scanner-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            max-width: 100%;
            margin: 0;
            padding: 0;
            background: #fff;
            box-shadow: none;
            overflow: hidden;
        }

        @media (min-width: 601px) {
            .scanner-container {
                max-width: 600px;
                height: 100%;
                margin: 0 auto;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            }
        }

        .scanner-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: clamp(12px, 4vw, 20px);
            text-align: center;
            border-bottom: 4px solid var(--primary-dark);
            flex-shrink: 0;
        }

        .scanner-header h1 {
            font-size: clamp(18px, 5vw, 24px);
            margin-bottom: 4px;
        }

        .scanner-header p {
            font-size: clamp(12px, 3vw, 14px);
            opacity: 0.9;
        }

        /* Passcode Section */
        .passcode-section {
            padding: clamp(12px, 4vw, 20px);
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 2vw, 12px);
            flex-shrink: 0;
            overflow-x: hidden;
        }

        .passcode-section.hidden {
            display: none;
        }

        .passcode-label {
            font-size: clamp(11px, 2.5vw, 13px);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .passcode-input-group {
            display: flex;
            gap: clamp(6px, 2vw, 8px);
            justify-content: center;
            flex-wrap: nowrap;
            padding: 0 clamp(8px, 2vw, 12px);
        }

        .passcode-digit {
            flex: 1;
            min-width: 40px;
            max-width: 60px;
            width: clamp(40px, 15vw, 60px);
            height: clamp(40px, 15vw, 60px);
            font-size: clamp(18px, 4vw, 24px);
            font-weight: bold;
            text-align: center;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--primary);
            transition: all 0.2s;
        }

        .passcode-digit:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
        }

        .passcode-digit.filled {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .passcode-actions {
            display: flex;
            gap: clamp(6px, 2vw, 8px);
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 clamp(8px, 2vw, 12px);
        }

        /* Disabled state */
        .passcode-section.locked .passcode-actions button {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Scanner Section */
        .scanner-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: clamp(12px, 3vw, 20px);
            gap: clamp(12px, 2vw, 16px);
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
        }

        .camera-preview {
            flex: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 200px;
            width: 100%;
        }

        #esCameraPreview {
            width: 100%;
            height: 100%;
        }

        .camera-controls {
            display: flex;
            gap: clamp(6px, 2vw, 8px);
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 0 clamp(4px, 1vw, 8px);
        }

        .btn {
            padding: clamp(10px, 2.5vw, 12px) clamp(14px, 3vw, 20px);
            border: none;
            border-radius: 6px;
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            min-height: 36px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-lighter);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--border);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status */
        .scanner-status {
            padding: clamp(10px, 2vw, 12px);
            border-radius: 6px;
            text-align: center;
            font-size: clamp(12px, 2.5vw, 13px);
            font-weight: 600;
            background: var(--bg-light);
            color: var(--text-secondary);
            flex-shrink: 0;
            width: 100%;
        }

        .scanner-status.loading {
            color: var(--primary);
        }

        .scanner-status.success {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success);
        }

        .scanner-status.error {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger);
        }

        /* Results */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 2vw, 12px);
            max-height: 150px;
            overflow-y: auto;
            overflow-x: hidden;
            flex-shrink: 1;
        }

        .result-item {
            padding: clamp(10px, 2vw, 12px);
            border-radius: 6px;
            background: var(--bg-light);
            font-size: clamp(11px, 2.5vw, 13px);
            display: flex;
            align-items: center;
            gap: clamp(6px, 2vw, 8px);
            animation: slideIn 0.3s ease;
            word-break: break-word;
        }

        .result-item.success {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success);
        }

        .result-item.error {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger);
        }

        .result-icon {
            font-size: clamp(14px, 3vw, 16px);
            flex-shrink: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scanner-footer {
            padding: clamp(12px, 3vw, 16px) clamp(12px, 3vw, 20px);
            background: var(--bg-lighter);
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: clamp(10px, 2.5vw, 12px);
            color: var(--text-secondary);
            flex-shrink: 0;
            word-break: break-word;
        }

        /* Responsive */
        @media (max-width: 480px) {
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            .scanner-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
                box-shadow: none;
            }

            .scanner-header h1 {
                font-size: 18px;
            }

            .scanner-header {
                padding: 12px;
            }

            .scanner-main {
                padding: 12px;
                gap: 12px;
            }

            .passcode-section {
                padding: 12px;
            }

            .camera-preview {
                min-height: 200px;
                max-height: 40vh;
            }

            .btn {
                padding: 10px 14px;
                font-size: 12px;
                flex: 1;
                min-width: 70px;
            }

            .camera-controls {
                gap: 6px;
            }
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(196, 30, 58, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>

<body>
    <div class="scanner-container">
        <!-- Header -->
        <div class="scanner-header">
            <h1>🍽️ Event Check-In</h1>
            <p>Scan guest QR code to verify entry</p>
        </div>

        <!-- Passcode Entry Section -->
        <div class="passcode-section" id="passcodeSection">
            <div class="passcode-label">Staff Passcode (4 digits)</div>
            <div class="passcode-input-group">
                <input class="passcode-digit" type="text" inputmode="numeric" maxlength="1" data-index="0" />
                <input class="passcode-digit" type="text" inputmode="numeric" maxlength="1" data-index="1" />
                <input class="passcode-digit" type="text" inputmode="numeric" maxlength="1" data-index="2" />
                <input class="passcode-digit" type="text" inputmode="numeric" maxlength="1" data-index="3" />
            </div>
            <div class="passcode-actions">
                <button class="btn btn-primary" id="verifyPasscodeBtn">Verify Passcode</button>
                <button class="btn btn-secondary" id="clearPasscodeBtn">Clear</button>
            </div>
            <div id="passcodeStatus" class="scanner-status"></div>
        </div>

        <!-- Scanner Section -->
        <div class="scanner-main hidden" id="scannerMain">
            <div class="camera-preview">
                <div id="esCameraPreview" style="width: 100%; height: 100%;"></div>
            </div>

            <div class="camera-controls">
                <button class="btn btn-primary" id="startCameraBtn">📷 Start Camera</button>
                <button class="btn btn-secondary" id="stopCameraBtn" disabled>Stop Camera</button>
                <button class="btn btn-secondary" id="logoutBtn">🚪 Exit</button>
            </div>

            <div id="scannerStatus" class="scanner-status">Ready to scan</div>

            <div class="results-section" id="resultsList"></div>
        </div>

        <!-- Footer -->
        <div class="scanner-footer">
            Asian Wok & Grill | Secure Event Entry System
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            apiBase: '/index.php',
            scanCooldownMs: 2000,
            passcodeKey: 'awg_qr_scanner_session',
            sessionTimeout: 3600000, // 1 hour
        };

        // State
        let qrScanner = null;
        let isScannerRunning = false;
        let lastScannedToken = null;
        let lastScanTime = 0;
        let results = [];
        let sessionStartTime = null;

        // DOM Elements
        const passcodeSection = document.getElementById('passcodeSection');
        const scannerMain = document.getElementById('scannerMain');
        const passcodeInputs = Array.from(document.querySelectorAll('.passcode-digit'));
        const verifyPasscodeBtn = document.getElementById('verifyPasscodeBtn');
        const clearPasscodeBtn = document.getElementById('clearPasscodeBtn');
        const passcodeStatus = document.getElementById('passcodeStatus');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const stopCameraBtn = document.getElementById('stopCameraBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const scannerStatus = document.getElementById('scannerStatus');
        const resultsList = document.getElementById('resultsList');

        // Helper: Make API calls
        async function apiCall(action, body = {}) {
            try {
                const response = await fetch(CONFIG.apiBase, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ action, ...body }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`API call failed: ${error.message}`);
                throw error;
            }
        }

        // Session Management
        function saveSession(passcode) {
            const session = {
                passcode: passcode,
                timestamp: Date.now(),
            };
            sessionStorage.setItem(CONFIG.passcodeKey, JSON.stringify(session));
            sessionStartTime = Date.now();
        }

        function loadSession() {
            const raw = sessionStorage.getItem(CONFIG.passcodeKey);
            if (!raw) return null;

            try {
                const session = JSON.parse(raw);
                const elapsed = Date.now() - session.timestamp;
                if (elapsed > CONFIG.sessionTimeout) {
                    sessionStorage.removeItem(CONFIG.passcodeKey);
                    return null;
                }
                return session;
            } catch (_) {
                return null;
            }
        }

        function clearSession() {
            sessionStorage.removeItem(CONFIG.passcodeKey);
            sessionStartTime = null;
        }

        // Passcode Input Handling
        passcodeInputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (!/^\d$/.test(e.key) && !['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                }
            });

            input.addEventListener('input', (e) => {
                const value = e.target.value.slice(-1);
                input.value = value;

                if (value && index < passcodeInputs.length - 1) {
                    passcodeInputs[index + 1].focus();
                }

                // Check if all fields are filled
                if (passcodeInputs.every(inp => inp.value.trim())) {
                    verifyPasscodeBtn.click();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    passcodeInputs[index - 1].focus();
                }
            });
        });

        verifyPasscodeBtn.addEventListener('click', async () => {
            const passcode = passcodeInputs.map(inp => inp.value).join('');

            if (passcode.length !== 4) {
                showPasscodeStatus('Please enter 4 digits', 'error');
                return;
            }

            try {
                setPasscodeLoading(true);
                showPasscodeStatus('Verifying passcode...', 'loading');

                const response = await apiCall('public_verify_scanner_passcode', {
                    passcode: passcode,
                });

                if (response.ok || response.verified) {
                    showPasscodeStatus('✓ Access Granted', 'success');
                    saveSession(passcode);
                    setTimeout(() => {
                        passcodeSection.classList.add('hidden');
                        scannerMain.classList.remove('hidden');
                        initCamera();
                    }, 600);
                } else {
                    showPasscodeStatus('✗ Invalid passcode', 'error');
                    passcodeInputs.forEach(inp => inp.value = '');
                    passcodeInputs[0].focus();
                }
            } catch (error) {
                showPasscodeStatus(`✗ ${error.message}`, 'error');
                setPasscodeLoading(false);
            }
        });

        clearPasscodeBtn.addEventListener('click', () => {
            passcodeInputs.forEach(inp => inp.value = '');
            passcodeInputs[0].focus();
        });

        function showPasscodeStatus(message, type) {
            passcodeStatus.textContent = message;
            passcodeStatus.className = `scanner-status ${type}`;
        }

        function setPasscodeLoading(loading) {
            verifyPasscodeBtn.disabled = loading;
            clearPasscodeBtn.disabled = loading;
        }

        // QR Scanner
        async function loadQrScannerLibrary() {
            return new Promise((resolve) => {
                if (window.Html5Qrcode) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.4/html5-qrcode.min.js';
                script.onload = resolve;
                script.onerror = () => {
                    console.error('Failed to load html5-qrcode library');
                    resolve();
                };
                document.head.appendChild(script);
            });
        }

        async function initCamera() {
            try {
                await loadQrScannerLibrary();
                if (!window.Html5Qrcode) {
                    setScannerStatus('QR library failed to load', 'error');
                    return;
                }

                if (isScannerRunning) {
                    setScannerStatus('Camera already running', 'loading');
                    return;
                }

                qrScanner = new window.Html5Qrcode('esCameraPreview');
                await qrScanner.start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onQrCodeSuccess,
                    onQrCodeError
                );

                isScannerRunning = true;
                setScannerStatus('🟢 Camera active - scanning...', 'loading');
                updateCameraButtons();
            } catch (error) {
                setScannerStatus(`Camera error: ${error.message}`, 'error');
                console.error('Camera error:', error);
            }
        }

        async function stopCamera() {
            if (!qrScanner || !isScannerRunning) return;

            try {
                await qrScanner.stop();
                isScannerRunning = false;
                setScannerStatus('Camera stopped', 'loading');
                updateCameraButtons();
            } catch (error) {
                setScannerStatus(`Failed to stop: ${error.message}`, 'error');
            }
        }

        function onQrCodeSuccess(decodedText) {
            const now = Date.now();
            if (lastScannedToken === decodedText && now - lastScanTime < CONFIG.scanCooldownMs) {
                return;
            }

            lastScannedToken = decodedText;
            lastScanTime = now;

            const token = String(decodedText || '').trim();
            if (!token) return;

            verifyEventToken(token);
        }

        function onQrCodeError() {
            // Suppress errors
        }

        async function verifyEventToken(token) {
            try {
                setScannerStatus('Verifying...', 'loading');
                const response = await apiCall('verify_event_qr', {
                    guestToken: token,
                });

                if (response.ok) {
                    const guest = response.guest || {};
                    setScannerStatus(`✓ ${guest.name || 'Guest'} checked in!`, 'success');
                    addResult(token, true, `${guest.name || 'Guest'} checked in`);
                } else {
                    setScannerStatus(`✗ ${response.message || 'Verification failed'}`, 'error');
                    addResult(token, false, response.message || 'Verification failed');
                }
            } catch (error) {
                setScannerStatus(`✗ ${error.message}`, 'error');
                addResult(token, false, error.message);
            }
        }

        function setScannerStatus(message, type = 'loading') {
            scannerStatus.textContent = message;
            scannerStatus.className = `scanner-status ${type}`;
        }

        function addResult(token, success, message) {
            const item = document.createElement('div');
            item.className = `result-item ${success ? 'success' : 'error'}`;
            item.innerHTML = `
                <span class="result-icon">${success ? '✓' : '✗'}</span>
                <span>${message}</span>
            `;
            resultsList.insertBefore(item, resultsList.firstChild);
            if (resultsList.children.length > 20) {
                resultsList.removeChild(resultsList.lastChild);
            }
        }

        function updateCameraButtons() {
            startCameraBtn.disabled = isScannerRunning;
            stopCameraBtn.disabled = !isScannerRunning;
        }

        startCameraBtn.addEventListener('click', initCamera);
        stopCameraBtn.addEventListener('click', stopCamera);
        logoutBtn.addEventListener('click', () => {
            if (confirm('Exit scanner and return to passcode entry?')) {
                stopCamera();
                clearSession();
                results = [];
                resultsList.innerHTML = '';
                passcodeInputs.forEach(inp => inp.value = '');
                scannerMain.classList.add('hidden');
                passcodeSection.classList.remove('hidden');
                passcodeInputs[0].focus();
                setScannerStatus('Ready to scan', 'loading');
            }
        });

        // Check for existing session on load
        window.addEventListener('load', () => {
            const session = loadSession();
            if (session) {
                passcodeSection.classList.add('hidden');
                scannerMain.classList.remove('hidden');
                initCamera();
            } else {
                passcodeInputs[0].focus();
            }
        });
    </script>
</body>
