<body>
  <script>
    (function redirectToEventDetails() {
      const params = new URLSearchParams(window.location.search);
      const target = new URL('../events.html', window.location.href);
      const eventId = params.get('eventId') || params.get('event_id') || '';
      const eventSlug = params.get('eventSlug') || params.get('event_slug') || '';
      if (eventId) {
        target.searchParams.set('eventId', eventId);
      }
      if (eventSlug) {
        target.searchParams.set('eventSlug', eventSlug);
      }
      target.hash = 'register';
      window.location.replace(target.toString());
    })();
  </script>
  <a href="../events.html#register">Open event registration</a>
</body>
</html>
