<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Asian Wok &amp; Grill</title>
  <meta name="theme-color" content="#f2e3cf" />
  <style>
    :root {
      color-scheme: light;
      --bg-1: #fff9f0;
      --bg-2: #f8ead7;
      --ink: #2d2218;
      --ember: #b46a2d;
      --ember-2: #d98a38;
      --ember-3: #f2b466;
      --panel: rgba(255, 252, 247, 0.88);
      --ring: rgba(180, 106, 45, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(242, 180, 102, 0.32), transparent 28%),
        radial-gradient(circle at 80% 18%, rgba(180, 106, 45, 0.22), transparent 26%),
        radial-gradient(circle at 50% 82%, rgba(242, 180, 102, 0.18), transparent 30%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(72vw, 420px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .halo {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0) 66%);
      filter: blur(2px);
      animation: breathe 2.8s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      background:
        radial-gradient(circle at center, transparent 53%, rgba(255, 255, 255, 0) 54%),
        conic-gradient(from 90deg, rgba(180, 106, 45, 0.02), rgba(180, 106, 45, 0.35), rgba(242, 180, 102, 0.06), rgba(180, 106, 45, 0.55), rgba(180, 106, 45, 0.02));
      -webkit-mask: radial-gradient(circle, transparent 58%, #000 58.5%);
      mask: radial-gradient(circle, transparent 58%, #000 58.5%);
      animation: spin 5.6s linear infinite;
      opacity: 0.85;
    }

    .ring.ring-2 {
      inset: 7%;
      animation-duration: 8.2s;
      opacity: 0.52;
      filter: blur(0.2px);
    }

    .ring.ring-3 {
      inset: 14%;
      animation-duration: 11s;
      opacity: 0.28;
      transform: rotate(12deg);
    }

    .core {
      position: relative;
      width: 42%;
      aspect-ratio: 1;
      border-radius: 28%;
      display: grid;
      place-items: center;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(255, 246, 232, 0.88)),
        var(--panel);
      box-shadow:
        0 28px 80px rgba(105, 57, 18, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(180, 106, 45, 0.12);
      transform: translateY(0);
      animation: float 2.8s ease-in-out infinite;
      overflow: hidden;
    }

    .core::before {
      content: '';
      position: absolute;
      inset: -24%;
      background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.9), transparent 46%);
      opacity: 0.7;
      pointer-events: none;
    }

    .core::after {
      content: '';
      position: absolute;
      inset: auto -10% -30% -10%;
      height: 42%;
      background: linear-gradient(180deg, transparent, rgba(180, 106, 45, 0.14), rgba(180, 106, 45, 0.04));
      filter: blur(16px);
      pointer-events: none;
    }

    .logo {
      position: relative;
      width: 62%;
      height: auto;
      z-index: 1;
      filter: drop-shadow(0 10px 18px rgba(133, 77, 24, 0.18));
      animation: shimmer 2.6s ease-in-out infinite;
    }

    .spark,
    .spark::before,
    .spark::after {
      position: absolute;
      content: '';
      display: block;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(242, 180, 102, 0.95), transparent);
      filter: blur(1px);
    }

    .spark {
      width: 22%;
      height: 2px;
      top: 20%;
      left: 4%;
      transform: rotate(-28deg);
      animation: glide 2.9s ease-in-out infinite;
    }

    .spark::before {
      width: 14px;
      height: 14px;
      top: -6px;
      left: 14%;
      background: rgba(242, 180, 102, 0.76);
      box-shadow: 0 0 18px rgba(242, 180, 102, 0.45);
    }

    .spark::after {
      width: 16%;
      height: 2px;
      top: 0;
      right: -8%;
      opacity: 0.8;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-8px) scale(1.01);
      }
    }

    @keyframes breathe {
      0%,
      100% {
        transform: scale(0.98);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes shimmer {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.92;
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
      }
    }

    @keyframes glide {
      0%,
      100% {
        opacity: 0.15;
        transform: translateX(-12%) rotate(-28deg);
      }
      50% {
        opacity: 1;
        transform: translateX(136%) rotate(-28deg);
      }
    }

    @media (max-width: 640px) {
      .scene {
        width: min(86vw, 360px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .halo,
      .ring,
      .core,
      .logo,
      .spark {
        animation: none !important;
      }
    }
  </style>

<body>
  <main class="scene" aria-label="Asian Wok & Grill QR transition animation">
    <div class="halo" aria-hidden="true"></div>
    <div class="ring ring-1" aria-hidden="true"></div>
    <div class="ring ring-2" aria-hidden="true"></div>
    <div class="ring ring-3" aria-hidden="true"></div>
    <div class="core" aria-hidden="true">
      <div class="spark"></div>
      <img class="logo" src="../assets/images/circlelogo.png" alt="" aria-hidden="true" />
    </div>
    <div id="status" class="sr-only" aria-live="polite"></div>
  </main>

  <script type="module">
    import { buildPhpActionUrl } from '../js/runtime-config.js';

    const statusEl = document.getElementById('status');
    const MENU_FALLBACK = '/menu.html';
    const REDIRECT_MAX_WAIT_MS = 1700;
    const MIN_ANIMATION_MS = 1000;

    function getSlug() {
      const path = window.location.pathname || '';
      const match = path.match(/\/qr\/([a-z0-9][a-z0-9-]{1,180})\/?$/i);
      if (match && match[1]) {
        return match[1].toLowerCase();
      }
      const qs = new URLSearchParams(window.location.search);
      return String(qs.get('slug') || '').trim().toLowerCase();
    }

    function inferChannel(slug) {
      return slug.includes('admin') ? 'admin' : 'customer';
    }

    function detectDevice(userAgent) {
      const ua = String(userAgent || '').toLowerCase();
      if (/(ipad|tablet|playbook|silk)|(android(?!.*mobile))/i.test(ua)) {
        return 'tablet';
      }
      if (/mobile|iphone|ipod|android|blackberry|iemobile|opera mini/i.test(ua)) {
        return 'mobile';
      }
      return 'desktop';
    }

    function readClientContext() {
      const userAgent = navigator.userAgent || '';
      return {
        userAgent,
        referer: document.referrer || '',
        language: navigator.language || '',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
        screen: `${window.screen?.width || 0}x${window.screen?.height || 0}`,
        device: detectDevice(userAgent),
        browser: navigator.userAgent || '',
        os: navigator.platform || '',
      };
    }

    async function readGeoContext() {
      if (!('geolocation' in navigator)) {
        return {};
      }

      return new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const latitude = Number(position.coords?.latitude || 0);
            const longitude = Number(position.coords?.longitude || 0);
            if (!latitude || !longitude) {
              resolve({});
              return;
            }

            resolve({
              city: `Lat ${latitude.toFixed(5)}`,
              region: `Lng ${longitude.toFixed(5)}`,
              country: 'GPS',
            });
          },
          () => resolve({}),
          {
            enableHighAccuracy: false,
            timeout: 1200,
            maximumAge: 300000,
          }
        );
      });
    }

    async function callResolve(slug, channel) {
      const url = `${buildPhpActionUrl('qr_redirect_resolve')}&slug=${encodeURIComponent(slug)}&channel=${encodeURIComponent(channel)}`;
      const response = await fetch(url, { method: 'GET', cache: 'no-store' });
      return response.json();
    }

    async function callScanLog(payload) {
      await fetch(buildPhpActionUrl('qr_scan_client'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ action: 'qr_scan_client', ...payload }),
      });
    }

    async function run() {
      const startedAt = Date.now();
      const slug = getSlug();
      const channel = inferChannel(slug);

      let target = MENU_FALLBACK;
      let resolvePayload = null;

      statusEl.textContent = 'Loading route';

      try {
        resolvePayload = await callResolve(slug, channel);
        if (!resolvePayload?.ok) {
          throw new Error(resolvePayload?.message || 'Failed to resolve QR route.');
        }
        target = String(resolvePayload.resolvedUrl || MENU_FALLBACK);
      } catch (_error) {
        target = MENU_FALLBACK;
      }

      const ctx = readClientContext();
      const geo = await readGeoContext();
      if (!geo.region && ctx.timezone) {
        geo.region = ctx.timezone;
      }

      statusEl.textContent = 'Logging scan';
      try {
        await callScanLog({
          channel,
          qrSlug: resolvePayload?.qrSlug || slug,
          qrId: resolvePayload?.qrId || null,
          destinationKey: resolvePayload?.destinationKey || '',
          destinationLabel: resolvePayload?.destinationLabel || '',
          resolvedUrl: target,
          ...ctx,
          ...geo,
        });
      } catch (_error) {
      }

      const elapsed = Date.now() - startedAt;
      const dwellMs = Math.max(0, MIN_ANIMATION_MS - elapsed);
      if (dwellMs > 0) {
        await new Promise((resolve) => window.setTimeout(resolve, dwellMs));
      }

      statusEl.textContent = 'Opening destination';
      const hardTimeout = window.setTimeout(() => {
        window.location.replace(MENU_FALLBACK);
      }, REDIRECT_MAX_WAIT_MS);

      window.location.replace(target);
      window.clearTimeout(hardTimeout);
    }

    run();
  </script>
</body>
</html>
