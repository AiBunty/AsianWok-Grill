<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Code Center</title>
  <style>
    body { font-family: "Segoe UI", Tahoma, sans-serif; margin: 0; padding: 24px; background: #f9fbff; color: #1f2e42; }
    .card { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid #d7e2f3; border-radius: 16px; padding: 20px; }
    input, button { font: inherit; padding: 10px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    button { background: #1f5fb8; border: none; color: #fff; border-radius: 8px; cursor: pointer; }
    img { display: block; width: min(420px, 90vw); margin: 16px auto 0; border: 1px solid #dbe5f2; border-radius: 12px; }
  </style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YTP5QMQJ9K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-YTP5QMQJ9K');
</script>
</head>
<body>
  <section class="card">
    <h1>QR Code Center</h1>
    <p>Generate a stable `/qr/{slug}` code for printing.</p>
    <input id="slug" placeholder="guest-menu" />
    <button id="generate" type="button">Generate QR</button>
    <img id="qr" alt="QR preview" hidden />
  </section>

  <script>
    const slugEl = document.getElementById('slug');
    const qrEl = document.getElementById('qr');
    const btn = document.getElementById('generate');

    btn.addEventListener('click', () => {
      const slug = String(slugEl.value || '').trim().toLowerCase();
      if (!slug) return;
      const publicUrl = `${window.location.origin}/qr/${encodeURIComponent(slug)}`;
      qrEl.src = `/?action=event_qr_image&data=${encodeURIComponent(publicUrl)}`;
      qrEl.hidden = false;
    });
  </script>
</body>
</html>
