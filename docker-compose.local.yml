services:
  awg-mysql:
    image: mysql:8.0
    container_name: awg-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asianwokandgrill_local
      MYSQL_USER: awg
      MYSQL_PASSWORD: awg_local
    ports:
      - "3307:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - awg_mysql_local_data:/var/lib/mysql

volumes:
  awg_mysql_local_data:
